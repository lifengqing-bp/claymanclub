name: Browser camera tests
on:
  pull_request:
  push:
    branches: [main, feat/camera-trajectories]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python -m unittest discover -s tests -v
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-camera-evidence
          path: outputs/browser-tests/
          retention-days: 30
